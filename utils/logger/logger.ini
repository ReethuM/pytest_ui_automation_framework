[loggers]
keys=root,frameworkLogger,seleniumLogger,urllib3Logger

[handlers]
keys=consoleHandler,frameworkFileHandler,seleniumFileHandler,urllib3FileHandler

[formatters]
keys=customFormatter

############# Root Logger #############
[logger_root]
level=DEBUG
handlers=consoleHandler

############# Framework Logger #############
[logger_frameworkLogger]
level=DEBUG
handlers=frameworkFileHandler
qualname=frameworkLogger
propagate=1

############# Selenium Logger #############
[logger_seleniumLogger]
level=WARNING
handlers=seleniumFileHandler
qualname=selenium
propagate=0

############# urllib3 Logger #############
[logger_urllib3Logger]
level=WARNING
handlers=urllib3FileHandler
qualname=urllib3
propagate=0

############# Handlers #############
[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=customFormatter
args=(sys.stdout,)

[handler_frameworkFileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=DEBUG
formatter=customFormatter
args=('logs/framework_log.log', 'midnight', 1, 7)

[handler_seleniumFileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=WARNING
formatter=customFormatter
args=('logs/selenium.log', 'midnight', 1, 3)

[handler_urllib3FileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=WARNING
formatter=customFormatter
args=('logs/urllib3.log', 'midnight', 1, 3)

############# Formatter #############
[formatter_customFormatter]
format = %(asctime)s | %(levelname)s | %(test_name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S